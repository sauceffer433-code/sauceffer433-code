<!doctype html><html lang="th"><head><meta charset="utf-8"><title>Bass Detective</title><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one dark neon "case file" shell. Menu = hero + dossier cards; game = HUD above two evidence boards that stack on phones. */
:root{
  --bg:#0a0612;--bg2:#120a22;--panel:#160d27;--panel2:#1f1336;--line:#32214f;
  --fg:#f2ebff;--mut:#a092c4;--pink:#ff2e93;--pink2:#ff7ac0;--vio:#7a3cff;--vio2:#b78bff;
  --good:#2ee59d;--bad:#ff4d5e;--gold:#ffd23f;
  --disp:'Unbounded','Kanit',system-ui,sans-serif;--body:'Kanit',system-ui,sans-serif;
  --shape:4px 18px 4px 18px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(900px 500px at 85% -10%,rgba(255,46,147,.18),transparent 60%),radial-gradient(800px 600px at -10% 10%,rgba(122,60,255,.22),transparent 60%);
  background-repeat:no-repeat;
  color:var(--fg);font:400 16px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px;
  -webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--pink2);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto}
.screen[hidden]{display:none}
h1,h2,h3,p{margin:0}
.eyebrow{font:600 11px/1 var(--disp);letter-spacing:.22em;text-transform:uppercase;color:var(--vio2)}

/* buttons */
.btn{border:1px solid var(--line);background:var(--panel2);padding:12px 20px;border-radius:var(--shape);font:600 13px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase;transition:transform .12s,box-shadow .2s,background .2s;min-height:46px}
.btn:hover{transform:translateY(-1px);background:#291a47}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--pink);border-color:var(--pink);color:#1a0612;box-shadow:0 0 0 1px #ff2e9340,0 8px 28px -6px rgba(255,46,147,.7)}
.btn.primary:hover{background:#ff4aa3;box-shadow:0 0 0 1px #ff2e9380,0 10px 34px -4px rgba(255,46,147,.9)}
.btn.vio{background:var(--vio);border-color:var(--vio);color:#fff;box-shadow:0 8px 26px -8px rgba(122,60,255,.8)}
.btn.vio:hover{background:#8d57ff}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;padding:9px 14px;font-size:11px}
.btn[disabled]{opacity:.4;pointer-events:none}
.icon-btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;width:42px;height:42px;display:grid;place-items:center}
.icon-btn[aria-pressed="false"]{opacity:.5}

/* menu */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.brandmini{font:900 12px/1 var(--disp);letter-spacing:.2em;color:var(--mut)}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:28px;align-items:center;padding:18px 0 26px}
.logo{display:flex;flex-direction:column;gap:2px;font-family:var(--disp);font-weight:900;line-height:.92;text-transform:uppercase}
.logo .l1{font-size:clamp(64px,13vw,124px);color:var(--pink);letter-spacing:-.02em;text-shadow:0 0 28px rgba(255,46,147,.55),0 0 2px #fff4}
.logo .l2{font-size:clamp(27px,5.6vw,52px);letter-spacing:.02em;color:transparent;-webkit-text-stroke:2px var(--vio2);text-shadow:0 0 24px rgba(122,60,255,.7)}
.tag{margin-top:18px;max-width:46ch;color:#d3c7ee;font-size:17px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.hero-art{position:relative;border:1px solid var(--line);border-radius:6px 28px 6px 28px;overflow:hidden;background:#0d0719;aspect-ratio:21/16;max-width:100%}
.hero-art svg{width:100%;height:100%;display:block}
.lensglow{animation:lens 5s ease-in-out infinite}
@keyframes lens{0%,100%{transform:translate(0,0)}50%{transform:translate(-14px,6px)}}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px 20px 6px 20px;padding:20px;min-width:0}
.card h2{font:600 12px/1 var(--disp);letter-spacing:.18em;text-transform:uppercase;color:var(--vio2);margin-bottom:14px}
.lvl{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.lvl .n{font:900 52px/1 var(--disp);color:var(--pink);text-shadow:0 0 18px rgba(255,46,147,.5)}
.lvl .t{font:600 18px/1.2 var(--body);color:var(--fg)}
.bar{height:10px;background:#0c0716;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:14px 0 6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--vio),var(--pink));box-shadow:0 0 14px var(--pink);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.muted{color:var(--mut);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:4px 12px 4px 12px;padding:12px 14px;min-width:0}
.stat b{display:block;font:600 22px/1.1 var(--body);font-variant-numeric:tabular-nums}
.stat span{display:block;font:500 11px/1.3 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-top:4px}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ach div{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:4px 12px 4px 12px;background:var(--bg2);min-width:0}
.ach .ic{flex:0 0 34px;height:34px;display:grid;place-items:center;border-radius:50%;border:2px solid var(--line);color:var(--mut);font:900 13px/1 var(--disp)}
.ach .on .ic{border-color:var(--pink);color:var(--pink);box-shadow:0 0 14px rgba(255,46,147,.5)}
.ach .on b{color:var(--fg)}
.ach b{display:block;font:600 14px/1.2 var(--body);color:var(--mut)}
.ach small{display:block;font-size:12px;color:var(--mut);line-height:1.3}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px}
.dailyline{display:flex;flex-direction:column;gap:6px}
.dailyline b{font:600 20px/1.2 var(--body)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--mut)}
.pill.ok{border-color:var(--good);color:var(--good)}

/* setup */
.bar-top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.h-title{font:900 clamp(22px,4vw,34px)/1.1 var(--disp);text-transform:uppercase}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:16px 0 22px}
.mode{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px 18px 6px 18px;padding:16px;display:flex;flex-direction:column;gap:6px;min-height:118px;transition:border-color .2s,box-shadow .2s}
.mode b{font:600 13px/1.2 var(--disp);letter-spacing:.08em}
.mode span{color:var(--mut);font-size:14px;line-height:1.35}
.mode[aria-checked="true"]{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink),0 0 28px -6px rgba(255,46,147,.6);background:var(--panel2)}
.diffs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.diff{background:var(--panel);border:1px solid var(--line);border-radius:4px 14px 4px 14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.diff b{font:600 12px/1.2 var(--disp);letter-spacing:.06em}
.diff span{font-size:13px;color:var(--mut);line-height:1.3}
.diff[aria-checked="true"]{border-color:var(--vio2);box-shadow:0 0 0 1px var(--vio2),0 0 22px -6px rgba(122,60,255,.8);background:var(--panel2)}
.setup-note{padding:12px 14px;border:1px dashed var(--line);border-radius:10px;color:#d3c7ee;font-size:15px;margin-bottom:18px}

/* game */
.hud{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;margin-bottom:12px}
.hud .cell{background:var(--panel);border:1px solid var(--line);border-radius:4px 12px 4px 12px;padding:8px 14px;min-width:92px;display:flex;flex-direction:column;justify-content:center}
.hud .cell small{font:500 10px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.hud .cell b{font:600 22px/1.15 var(--body);font-variant-numeric:tabular-nums}
.hud .grow{flex:1 1 180px}
.hud .case b{font:600 14px/1.25 var(--disp);letter-spacing:.04em}
.timer.warn b{color:var(--bad);animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.45}}
.pips{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.pips i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:transparent;transition:.25s}
.pips i.on{background:var(--pink);border-color:var(--pink);box-shadow:0 0 10px var(--pink)}
.actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.boards{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:relative}
.board{position:relative;aspect-ratio:3/2;border:2px solid var(--line);border-radius:6px 22px 6px 22px;overflow:hidden;background:#0d0719;touch-action:manipulation;cursor:crosshair;user-select:none;-webkit-user-select:none;max-width:100%}
.board canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.board .tagc{position:absolute;left:10px;top:8px;font:700 10px/1 var(--disp);letter-spacing:.2em;color:#fff;background:rgba(10,6,18,.65);padding:5px 8px;border-radius:4px;pointer-events:none}
.marks{position:absolute;inset:0;pointer-events:none}
.ring{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--pink),0 0 18px 3px var(--pink),inset 0 0 14px rgba(255,46,147,.6);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(1.8);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.hint{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:3px dashed var(--gold);box-shadow:0 0 22px rgba(255,210,63,.55);animation:hintp 1s ease-in-out infinite alternate,fade 3.2s forwards}
@keyframes hintp{from{scale:.92}to{scale:1.06}}
@keyframes fade{0%,70%{opacity:1}100%{opacity:0}}
.xmark{position:absolute;width:34px;height:34px;transform:translate(-50%,-50%);animation:xm .7s forwards}
.xmark::before,.xmark::after{content:"";position:absolute;left:50%;top:50%;width:100%;height:5px;background:var(--bad);border-radius:3px;box-shadow:0 0 12px var(--bad)}
.xmark::before{transform:translate(-50%,-50%) rotate(45deg)}.xmark::after{transform:translate(-50%,-50%) rotate(-45deg)}
@keyframes xm{0%{scale:.4;opacity:1}30%{scale:1.15}100%{scale:1;opacity:0}}
.dup{position:absolute;width:30px;height:30px;transform:translate(-50%,-50%);border-radius:50%;border:2px solid var(--vio2);animation:xm .5s forwards}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{translate:0}20%{translate:-7px}40%{translate:6px}60%{translate:-4px}80%{translate:3px}}
.flash{animation:flash .45s}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(255,77,94,.9)}100%{box-shadow:0 0 0 16px rgba(255,77,94,0)}}
.tip{margin-top:12px;color:var(--mut);font-size:14px;text-align:center;min-height:21px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--panel2);border:1px solid var(--pink);border-radius:4px 14px 4px 14px;padding:11px 18px;box-shadow:0 10px 36px rgba(0,0,0,.6),0 0 24px -4px rgba(255,46,147,.6);opacity:0;pointer-events:none;transition:.3s;z-index:60;max-width:calc(100vw - 32px);font-weight:500;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:rgba(7,4,14,.88);backdrop-filter:blur(8px);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.ov[hidden]{display:none}
.panel{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:8px 28px 8px 28px;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.6);position:relative;min-width:0}
.panel h2{font:900 clamp(24px,5vw,36px)/1.05 var(--disp);text-transform:uppercase;color:var(--pink);text-shadow:0 0 22px rgba(255,46,147,.5);margin-bottom:6px}
.panel h2.lose{color:var(--bad);text-shadow:0 0 22px rgba(255,77,94,.45)}
.panel .sub{color:var(--mut);margin-bottom:16px}
.panel .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.res-grid .stat b{font-size:20px}
.newtag{display:inline-block;font:700 10px/1 var(--disp);letter-spacing:.14em;background:var(--gold);color:#241800;padding:4px 7px;border-radius:3px;margin-left:6px;vertical-align:middle}
.levelup{margin-top:12px;padding:10px 14px;border:1px solid var(--gold);border-radius:8px;color:var(--gold);font-weight:500}
.achnew{margin-top:12px;display:grid;gap:6px}
.achnew div{padding:8px 12px;border:1px solid var(--pink);border-radius:8px;font-size:14px}
.achnew b{color:var(--pink)}
#confetti{position:fixed;inset:0;z-index:55;pointer-events:none;width:100%;height:100%}
.spinner{width:68px;height:68px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--pink);border-right-color:var(--vio);animation:spin .9s linear infinite;margin:0 auto 18px;box-shadow:0 0 30px -4px rgba(255,46,147,.5)}
@keyframes spin{to{transform:rotate(360deg)}}
.center{text-align:center}
.how ol{margin:12px 0 0;padding-left:22px;display:grid;gap:10px;color:#dcd2f2}
.how li b{color:var(--pink2)}
.x-close{position:absolute;right:14px;top:14px}
.pausebox{position:absolute;inset:0;z-index:5;border-radius:6px 22px 6px 22px;background:rgba(7,4,14,.96);display:grid;place-items:center;text-align:center;padding:16px}
.pausebox[hidden]{display:none}
.pausebox h2{font:900 clamp(26px,5vw,40px)/1 var(--disp);color:var(--vio2);margin-bottom:16px;text-shadow:0 0 24px rgba(122,60,255,.7)}
.pausebox .row{justify-content:center}

/* answer reveal */
.ring.miss{border-color:var(--gold);box-shadow:0 0 0 2px var(--bad),0 0 18px 3px var(--bad),inset 0 0 14px rgba(255,77,94,.5)}
.rnum{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:var(--bg);border:2px solid var(--gold);color:var(--gold);font:700 12px/18px var(--body);text-align:center;pointer-events:none;z-index:2}
.rnum.ok{border-color:var(--good);color:var(--good)}
.revbar{margin-top:14px;background:var(--panel);border:1px solid var(--gold);border-radius:6px 20px 6px 20px;padding:18px}
.revbar[hidden]{display:none}
.revbar h3{font:600 12px/1 var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.revbar .sum{color:var(--mut);font-size:14px;margin-bottom:12px}
.revbar ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.revbar li{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:4px 12px 4px 12px;background:var(--bg2);font-size:15px;min-width:0}
.revbar li i{flex:0 0 24px;height:24px;border-radius:50%;border:2px solid var(--gold);color:var(--gold);font:700 12px/20px var(--body);text-align:center;font-style:normal}
.revbar li.ok i{border-color:var(--good);color:var(--good)}
.revbar li small{display:block;color:var(--mut);font-size:12px}
.revbar li.miss small{color:var(--bad)}
.revbar li.ok small{color:var(--good)}
.revbar .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .hero-art{order:-1;aspect-ratio:21/12}
  .cards{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:720px){
  .boards{grid-template-columns:1fr}
  .hud .cell{min-width:78px;padding:7px 11px}
  .hud .cell b{font-size:19px}
  .actions{margin-left:0;width:100%}
  .actions .btn{flex:1 1 0;padding-inline:8px}
  .res-grid{grid-template-columns:repeat(2,1fr)}
  .panel{padding:20px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
